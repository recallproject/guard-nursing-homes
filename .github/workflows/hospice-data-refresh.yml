name: Hospice data refresh

on:
  schedule:
    # 13:13 UTC daily ≈ 6:13 AM PT / 9:13 AM ET. Off-hour minute on purpose.
    - cron: '13 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run feeds + court + MFCU pipelines
        run: |
          set -e
          node scripts/build-hospice-news-feed.js     || echo "news pipeline failed (continuing)"
          node scripts/build-doj-actions.js           || echo "doj pipeline failed (continuing)"
          node scripts/build-courtlistener-actions.js || echo "courtlistener pipeline failed (continuing)"
          node scripts/build-mfcu-actions.js          || echo "mfcu pipeline failed (continuing)"

      - name: Count refreshed items
        id: counts
        run: |
          NEWS_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/data/hospice/news-feed.json')).feed_items?.length ?? 0)")
          DOJ_COUNT=$(node  -e "console.log(JSON.parse(require('fs').readFileSync('public/data/hospice/doj-actions.json')).actions?.length ?? 0)")
          COURT_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/data/hospice/courtlistener-actions.json')).actions?.length ?? 0)")
          MFCU_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/data/hospice/mfcu-actions.json')).actions?.length ?? 0)")
          echo "news_count=${NEWS_COUNT}" >> "$GITHUB_OUTPUT"
          echo "doj_count=${DOJ_COUNT}" >> "$GITHUB_OUTPUT"
          echo "court_count=${COURT_COUNT}" >> "$GITHUB_OUTPUT"
          echo "mfcu_count=${MFCU_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Create refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/hospice-data-refresh
          base: main
          delete-branch: true
          commit-message: Daily hospice feed refresh: ${{ steps.counts.outputs.news_count }} news + ${{ steps.counts.outputs.doj_count }} DOJ + ${{ steps.counts.outputs.court_count }} court + ${{ steps.counts.outputs.mfcu_count }} MFCU items
          title: Daily hospice feed refresh
          body: |
            Automated hospice feed refresh from the scheduled workflow.

            Counts:
            - News: ${{ steps.counts.outputs.news_count }}
            - DOJ: ${{ steps.counts.outputs.doj_count }}
            - CourtListener: ${{ steps.counts.outputs.court_count }}
            - MFCU: ${{ steps.counts.outputs.mfcu_count }}
          add-paths: |
            public/data/hospice/news-feed.json
            public/data/hospice/doj-actions.json
            public/data/hospice/courtlistener-actions.json
            public/data/hospice/mfcu-actions.json
