name: Hospice data refresh

# Hands-free daily land on main.
#
# GITHUB_TOKEN cannot merge to main: branch protection requires ≥1 approving
# review from a reviewer with write access. This workflow therefore lands via
# secrets.HOSPICE_MERGE_TOKEN (fine-grained PAT from a write-access user).
# See scripts/land-hospice-refresh.sh for the exact push-vs-PR+approve flow
# and the secret scopes Robert must create.

on:
  schedule:
    # 13:13 UTC daily ≈ 6:13 AM PT / 9:13 AM ET. Off-hour minute on purpose.
    - cron: '13 13 * * *'
  workflow_dispatch: {}

concurrency:
  group: hospice-data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # Fail before scraping if the merge PAT is missing, with the exact
      # Settings → Secrets instructions (see scripts/land-hospice-refresh.sh).
      - name: Require HOSPICE_MERGE_TOKEN
        env:
          HOSPICE_MERGE_TOKEN: ${{ secrets.HOSPICE_MERGE_TOKEN }}
        run: bash scripts/land-hospice-refresh.sh --require-token-only

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run feeds + court + MFCU pipelines
        run: |
          set -e
          node scripts/build-hospice-news-feed.js     || echo "news pipeline failed (continuing)"
          node scripts/build-doj-actions.js           || echo "doj pipeline failed (continuing)"
          node scripts/build-courtlistener-actions.js || echo "courtlistener pipeline failed (continuing)"
          node scripts/build-mfcu-actions.js          || echo "mfcu pipeline failed (continuing)"

      - name: Commit and land on main
        run: bash scripts/land-hospice-refresh.sh
        env:
          HOSPICE_MERGE_TOKEN: ${{ secrets.HOSPICE_MERGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
